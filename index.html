<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>simple-agentic-md</title>
  <meta name="description" content="A local Markdown editor with a live side-by-side preview.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23b794f6'/%3E%3Cpath d='M8 10h16M8 16h10M8 22h16' stroke='%231a1208' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="32" height="32" aria-hidden="true">
        <rect x="1" y="1" width="30" height="30" rx="7" fill="#b794f6"/>
        <path d="M8 10h16M8 16h10M8 22h16" stroke="#1a1208" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <div>
        <p class="wordmark">simple-agentic-md</p>
        <p class="tagline">Local Markdown, live preview</p>
      </div>
    </div>
    <div class="actions">
      <button type="button" id="btn-new">New</button>
      <button type="button" id="btn-open">Open</button>
      <button type="button" id="btn-download" class="primary" title="Download .md (Ctrl+S or Cmd+S)">Download</button>
      <input id="file-input" type="file" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden>
    </div>
  </header>
  <div id="notice" class="notice" hidden role="status">
    <p id="notice-text"></p>
    <button type="button" id="notice-dismiss">Dismiss</button>
  </div>
  <main class="panes">
    <section class="pane pane-editor" aria-label="Editor">
      <div class="pane-bar">
        <p class="pane-title"><label for="editor">Editor</label></p>
        <span id="doc-name" class="meta">untitled.md</span>
      </div>
      <textarea id="editor" spellcheck="true" autocomplete="off" autocapitalize="off" placeholder="Write Markdown…"></textarea>
    </section>
    <section class="pane pane-preview" aria-label="Preview">
      <div class="pane-bar">
        <p class="pane-title">Preview</p>
        <span class="meta"><span id="save-state">Saved</span> · <span id="char-count">0 characters</span></span>
      </div>
      <div id="preview" class="preview" role="region" aria-label="Rendered preview"></div>
    </section>
  </main>
  <noscript><p class="noscript">This editor needs JavaScript. It still runs entirely in your browser — nothing is uploaded.</p></noscript>
  <script src="js/markdown.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
